appId: com.sentinela.app
productName: Sentinela
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!drizzle/*'
  - '!{electron.vite.config,drizzle.config}.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,guide.md,projeto.md,components.json}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
extraResources:
  - from: drizzle
    to: drizzle
win:
  executableName: sentinela
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
  category: Education
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
